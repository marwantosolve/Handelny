name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: handelny
          POSTGRES_PASSWORD: handelny
          POSTGRES_DB: handelny
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handelny"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        # MinIO's default entrypoint needs a command override to serve;
        # GitHub Actions `services:` doesn't support custom `command`, so we
        # rely on the official image's default CMD (`minio server /data`),
        # which is enough for put/get/delete object calls in tests.

      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql+asyncpg://handelny:handelny@localhost:5432/handelny
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      QDRANT_URL: http://localhost:6333
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
